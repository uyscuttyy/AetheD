services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aethed
      POSTGRES_PASSWORD: aethed
      POSTGRES_DB: aethed
    ports:
      - "5432:5432"
    volumes:
      - aethed-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  aethed-postgres:
